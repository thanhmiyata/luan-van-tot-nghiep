# Question Analyzer Agent Prompts
# Analyzes natural language questions to understand intent, complexity, and required entities

agent_type: "question_analyzer"
description: "Analyze natural language questions to determine query intent, complexity, and required database entities"

prompts:
  3_step:
    system_prompt: |
      You are a Question Analyzer for SQL generation. Your task is to analyze natural language questions and provide structured analysis.

    user_prompt: |
      Analyze this question and provide a structured analysis:

      Question: "{question}"
      Database Schema: {schema}

      Provide analysis in JSON format:
      {{
        "intent": "COUNT|LIST|MAX_MIN|AGGREGATION|COMPARISON|JOIN",
        "complexity": "EASY|MEDIUM|HARD", 
        "entities": {{
          "tables": ["table1", "table2"],
          "columns": ["col1", "col2"],
          "values": ["value1", "value2"]
        }},
        "confidence": 0.95
      }}

  4_step:
    system_prompt: |
      You are an advanced Question Analyzer for SQL generation. Analyze natural language questions to understand:
      1. Query intent (what type of operation is needed)
      2. Complexity level (how difficult is this query)
      3. Required entities (tables, columns, values)
      4. Relationships between entities

    user_prompt: |
      Analyze this question in detail:

      Question: "{question}"
      Database Schema: {schema}

      Provide comprehensive analysis in JSON format:
      {{
        "intent": "COUNT|LIST|MAX_MIN|AGGREGATION|COMPARISON|JOIN",
        "complexity": "EASY|MEDIUM|HARD",
        "entities": {{
          "tables": ["required_table1", "required_table2"],
          "columns": ["needed_column1", "needed_column2"],
          "values": ["literal_value1", "literal_value2"]
        }},
        "relationships": ["table1.id = table2.foreign_id"],
        "operations": ["GROUP BY", "ORDER BY", "HAVING"],
        "confidence": 0.95,
        "reasoning": "Brief explanation of the analysis"
      }}

  6_step:
    system_prompt: |
      You are an expert Question Analyzer for advanced SQL generation. Your analysis will guide the entire pipeline.
      
      Analyze questions considering:
      1. Query intent and sub-intents
      2. Complexity and potential edge cases
      3. All required database entities
      4. Complex relationships and joins
      5. Ambiguities that need clarification
      6. Optimization opportunities

    user_prompt: |
      Perform deep analysis of this question:

      Question: "{question}"
      Refined Question: "{refined_question}"
      Recognized Entities: {entities}
      Database Schema: {schema}

      Provide expert-level analysis in JSON format:
      {{
        "intent": "COUNT|LIST|MAX_MIN|AGGREGATION|COMPARISON|JOIN",
        "sub_intents": ["secondary operations"],
        "complexity": "EASY|MEDIUM|HARD",
        "complexity_factors": ["multiple joins", "subqueries", "aggregations"],
        "entities": {{
          "tables": ["table1", "table2"],
          "columns": ["col1", "col2"], 
          "values": ["val1", "val2"],
          "computed": ["calculated fields"]
        }},
        "relationships": [
          {{"type": "JOIN", "tables": ["t1", "t2"], "condition": "t1.id = t2.fk"}},
          {{"type": "FILTER", "column": "col1", "operator": "=", "value": "val1"}}
        ],
        "required_operations": ["GROUP BY", "ORDER BY", "HAVING", "SUBQUERY"],
        "potential_ambiguities": ["unclear column reference"],
        "optimization_hints": ["use index on column X"],
        "confidence": 0.95,
        "detailed_reasoning": "Comprehensive explanation of analysis decisions"
      }}

examples:
  - question: "How many students are there?"
    expected_intent: "COUNT"
    expected_complexity: "EASY"
    expected_entities: 
      tables: ["student"]
      columns: ["id"]

  - question: "What is the average salary of instructors in each department?"
    expected_intent: "AGGREGATION" 
    expected_complexity: "MEDIUM"
    expected_entities:
      tables: ["instructor"]
      columns: ["salary", "dept_name"]

  - question: "Find students who have taken courses taught by instructors with salary > 50000"
    expected_intent: "JOIN"
    expected_complexity: "HARD"
    expected_entities:
      tables: ["student", "takes", "teaches", "instructor"]
      columns: ["student_id", "course_id", "instructor_id", "salary"]
