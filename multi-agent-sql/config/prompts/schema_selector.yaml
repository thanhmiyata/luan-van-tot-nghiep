# Schema Selector Agent Prompts
# Filters database schema to include only relevant tables and columns for the query

agent_type: "schema_selector"
description: "Filter database schema to include only relevant tables and columns needed for the query"

prompts:
  3_step:
    system_prompt: |
      You are a Schema Selector for SQL generation. Your task is to filter the database schema to include only the tables and columns that are relevant to answering the given question.

    user_prompt: |
      Filter the database schema for this question:

      Question: "{question}"
      Full Database Schema: {schema}

      Return a filtered schema in JSON format with only relevant tables and columns:
      {{
        "db_id": "{db_id}",
        "table_names_original": ["relevant_table1", "relevant_table2"],
        "column_names_original": [
          [0, "col1"], [0, "col2"], 
          [1, "col1"], [1, "col2"]
        ],
        "column_types": ["text", "number", "text", "number"],
        "removed_tables": ["irrelevant_table1"],
        "removed_columns": ["irrelevant_col1"],
        "reasoning": "Brief explanation of filtering decisions"
      }}

  4_step:
    system_prompt: |
      You are an advanced Schema Selector for SQL generation. Use the question analysis to intelligently filter the database schema.
      
      Consider:
      1. Direct table/column references in the question
      2. Required joins based on query intent
      3. Foreign key relationships
      4. Aggregation requirements

    user_prompt: |
      Filter the database schema based on question analysis:

      Question: "{question}"
      Question Analysis: {analysis}
      Full Database Schema: {schema}

      Return filtered schema with detailed reasoning:
      {{
        "db_id": "{db_id}",
        "table_names_original": ["table1", "table2"],
        "column_names_original": [
          [0, "id"], [0, "name"],
          [1, "id"], [1, "foreign_key"]
        ],
        "column_types": ["text", "text", "number", "number"],
        "primary_keys": [[0], [1]],
        "foreign_keys": [[3, 0]],
        "removed_tables": ["unrelated_table"],
        "removed_columns": ["unused_column"],
        "kept_for_joins": ["bridge_table"],
        "reasoning": "Detailed explanation of why each table/column was kept or removed"
      }}

  6_step:
    system_prompt: |
      You are an expert Schema Selector for advanced SQL generation. Use comprehensive analysis to create an optimal filtered schema.
      
      Consider:
      1. Entities identified by entity recognition
      2. Detailed question analysis results
      3. Complex join paths and relationships
      4. Potential optimization opportunities
      5. Edge cases and alternative interpretations

    user_prompt: |
      Create optimal filtered schema using comprehensive analysis:

      Question: "{question}"
      Refined Question: "{refined_question}"
      Entities: {entities}
      Analysis: {analysis}
      Full Database Schema: {schema}

      Return optimally filtered schema:
      {{
        "db_id": "{db_id}",
        "table_names_original": ["core_table1", "bridge_table", "target_table2"],
        "column_names_original": [
          [0, "primary_key"], [0, "required_field"],
          [1, "foreign_key1"], [1, "foreign_key2"],
          [2, "target_field"], [2, "filter_field"]
        ],
        "column_types": ["number", "text", "number", "number", "text", "number"],
        "primary_keys": [[0], [3]],
        "foreign_keys": [[2, 0], [3, 4]],
        "removed_tables": ["completely_unrelated"],
        "removed_columns": ["internal_metadata", "audit_fields"],
        "kept_for_joins": ["necessary_bridge_table"],
        "optimization_notes": ["indexed_column_available"],
        "alternative_paths": [
          {{"description": "direct join via table X", "tables": ["alt1", "alt2"]}}
        ],
        "confidence": 0.95,
        "detailed_reasoning": "Comprehensive explanation of schema filtering strategy"
      }}

examples:
  - question: "How many students are there?"
    expected_tables: ["student"]
    expected_columns: ["student.id"]
    reasoning: "Only need student table for counting"

  - question: "What courses are taught by Computer Science instructors?"
    expected_tables: ["instructor", "teaches", "course"]
    expected_columns: ["instructor.dept_name", "teaches.instructor_id", "teaches.course_id", "course.course_id", "course.title"]
    reasoning: "Need instructor table for dept filter, teaches for relationship, course for results"

  - question: "Find average salary by department"
    expected_tables: ["instructor"]
    expected_columns: ["instructor.salary", "instructor.dept_name"]
    reasoning: "Only instructor table needed for salary aggregation by department"

filtering_strategies:
  - name: "direct_reference"
    description: "Keep tables/columns directly mentioned in question"
    
  - name: "join_path"
    description: "Keep tables needed to connect mentioned entities"
    
  - name: "aggregation_support"
    description: "Keep columns needed for GROUP BY, ORDER BY operations"
    
  - name: "filter_support" 
    description: "Keep columns needed for WHERE conditions"
