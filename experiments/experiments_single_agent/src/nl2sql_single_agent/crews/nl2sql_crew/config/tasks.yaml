# Single task that performs all 3 steps in one API call
nl2sql_task:
  description: >
    You are a comprehensive Natural Language to SQL converter. You will perform three steps in sequence:
    
    STEP 1 - SCHEMA SELECTION:
    Analyze the natural language question and filter the database schema to keep only relevant tables and columns.
    Remove any tables, columns, foreign keys, and primary keys that are not needed to answer the question.
    
    STEP 2 - SQL GENERATION:
    Generate a SQL query based on the filtered schema and the natural language question.
    Ensure the SQL query accurately reflects the intent of the natural language question.
    
    STEP 3 - SQL VALIDATION:
    Validate and fix any syntax or logical errors in the generated SQL query.
    Ensure the query is syntactically correct and logically sound.
    
    Input:
    - question: "{question}"
    - raw_db_schema: ```{raw_db_schema}```

    Input format:
    - A natural language question describing the data query.
    - A JSON schema object of the database containing:
      - `db_id`: The database identifier string.
      - `table_names_original`: A list of table names.
      - `column_names_original`: A list of tuples (table_index, column_name).
      - `column_types`: A list of column data types.

  expected_output: >
    You must return a valid JSON object with the following structure:
    {
      "sql": "SELECT column1, column2 FROM table1 WHERE condition",
      "explain": "This query retrieves data from table1 where the condition is met",
      "error": "",
      "filtered_schema": "{\"db_id\":\"example\",\"table_names_original\":[\"table1\"],\"column_names_original\":[[0,\"column1\"],[0,\"column2\"]],\"column_types\":[\"text\",\"number\"]}"
    }
    
    Rules:
    - The "sql" field must contain a valid SQL query in a single line
    - The "explain" field must describe what the SQL query does
    - The "error" field should be empty if no errors, otherwise describe the error
    - The "filtered_schema" field should contain the filtered schema in JSON format

  agent: nl2sql_agent 