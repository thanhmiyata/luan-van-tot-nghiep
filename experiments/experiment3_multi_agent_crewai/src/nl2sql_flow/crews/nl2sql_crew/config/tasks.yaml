select_needed_schema_task:
  description: >
    **TASK**: Intelligent Schema Filtering for SQL Generation
    
    **OBJECTIVE**: Analyze the natural language question and filter the database schema to include ONLY
    the tables, columns, and relationships necessary to answer the question accurately.
    
    **INPUT**:
    - Question: {question}
    - Raw Database Schema: ```{raw_db_schema}```
    
    **ANALYSIS STEPS**:
    1. **Question Understanding**: Identify key entities, relationships, and data requirements
    2. **Table Relevance**: Determine which tables contain data needed to answer the question
    3. **Column Selection**: Include columns that are:
       - Explicitly mentioned in the question
       - Needed for JOINs (foreign keys, primary keys)
       - Required for filtering, grouping, or calculations
    4. **Relationship Preservation**: Maintain foreign key relationships for necessary JOINs
    
    **FILTERING RULES**:
    - ALWAYS include primary keys of selected tables
    - ALWAYS include foreign keys that enable necessary JOINs
    - Include columns mentioned directly or indirectly in the question
    - Exclude tables completely unrelated to the question
    - Preserve data type information for all included columns
    
    **OUTPUT FORMAT**: Return a valid JSON object with identical structure to input schema:
    ```json
    {
      "db_id": "database_name",
      "table_names_original": ["relevant_table1", "relevant_table2"],
      "column_names_original": [[0, "column1"], [0, "column2"], [1, "column3"]],
      "column_types": ["text", "number", "text"]
    }
    ```
    
  expected_output: >
    A filtered JSON schema object with the same structure as the input schema but only including relevant
    tables and columns related to the question containing:
      - Only relevant `table_names_original`.
      - Only relevant `column_names_original`.
      - Updated `column_types` corresponding to the filtered `column_names_original`.
      
  agent: schema_selector

generate_sql_task:
  description: >
    **TASK**: Generate Optimized SQL Query from Natural Language
    
    **OBJECTIVE**: Create a syntactically correct and semantically accurate SQL query that answers
    the natural language question using the provided filtered database schema.
    
    **INPUT**:
    - Question: "{question}"
    - Filtered Schema: ```{db_schema}```
    
    **SQL GENERATION REQUIREMENTS**:
    1. **Accuracy**: Query must correctly answer the natural language question
    2. **Schema Compliance**: Use only tables/columns provided in the filtered schema
    3. **SQL Standards**: Follow standard SQL syntax compatible with major databases
    4. **SIMPLICITY FIRST**: For basic questions, use basic queries - don't over-complicate
    5. **Format**: Single-line query with no line breaks or extra whitespace
    
    **QUERY COMPLEXITY GUIDELINES**:
    
    **FOR EASY/SIMPLE QUESTIONS**:
    - Basic SELECT column FROM table
    - Simple COUNT(*) operations
    - Basic WHERE filtering with single conditions
    - Simple ORDER BY for sorting
    - MIN/MAX operations without complex aggregations
    
    **FOR MEDIUM/COMPLEX QUESTIONS ONLY**:
    - JOINs between related tables using foreign keys
    - Aggregate functions with GROUP BY
    - LIMIT clauses for top-N queries
    - Subqueries when necessary for complex logic
    
    **FOR HARD/EXTRA QUESTIONS ONLY**:
    - Complex operations: INTERSECT, UNION, EXCEPT
    - NOT IN / NOT EXISTS patterns for exclusion
    - Multiple table JOINs (3+ tables)
    - Correlated subqueries and window functions
    
    **SQL BEST PRACTICES**:
    - Use table aliases for readability in JOINs
    - Proper quote handling for string literals
    - Case-insensitive matching with LIKE when appropriate
    - Handle potential NULL values appropriately
    - Use appropriate data type casting when needed
    - Break complex queries into logical steps
    - Use EXISTS instead of IN for better performance with NULLs
    - Consider INTERSECT/UNION for set operations
    - Validate foreign key relationships carefully
    
    **CRITICAL: QUESTION UNDERSTANDING FIRST**:
    - Read the question CAREFULLY - what exactly is being asked?
    - "Có bao nhiêu trạng thái tạm quyền?" ≠ "Count distinct temporary_acting values" 
    - "Có bao nhiêu trạng thái tạm quyền?" = "Count rows WHERE temporary_acting = 'Yes'"
    - "Liệt kê tổng số ngựa" = "List Total_Horses column" (not SUM grouped by farm)
    - Always match the question's intent, not just keywords
    
    **CROSS-LINGUISTIC INTELLIGENCE**:
    - **CRITICAL**: Vietnamese "Có" = "Yes" in boolean contexts (temporary_acting = 'Yes', NOT 'Có')
    - Department names: "Kho bạc" = "Treasury", "An ninh nội địa" = "Homeland Security" 
    - Status values: "Tạm thời" = "Temporary", "Chính thức" = "Official"
    - **INTERSECT queries**: Use English department names in WHERE clauses for exact match
    - **CASE SENSITIVITY**: Always match exact case from gold standard (department_id vs Department_ID)
    - When uncertain, prefer English translations over Vietnamese originals
    
    **COMPLEX QUERY PATTERNS**:
    - INTERSECT: Find common elements between two sets
    - NOT IN/NOT EXISTS: Exclusion logic, be careful with NULLs
    - Multiple JOINs: Chain relationships logically, validate foreign keys
    - Set operations: UNION for combining, EXCEPT for differences
    
    **OUTPUT FORMAT**: Return a valid JSON object:
    ```json
    {
      "sql": "SELECT column1, column2 FROM table1 WHERE condition ORDER BY column1"
    }
    ```
    
  expected_output: >
    A JSON object containing:
      - `sql`: The generated SQL query string, written in a single line with no line breaks.

  agent: sql_expert

validate_sql_task:
  description: >
    **TASK**: Comprehensive SQL Query Validation and Correction
    
    **OBJECTIVE**: Thoroughly validate the generated SQL query for correctness, fix any issues,
    and provide detailed explanations of the query's functionality.
    
    **INPUT**:
    - SQL Query: "{sql}"
    - Original Question: "{question}"
    - Database Schema: ```{db_schema}```
    
    **VALIDATION CHECKLIST**:
    1. **Syntax Validation**:
       - Check SQL syntax correctness
       - Verify proper parentheses, quotes, and semicolons
       - Ensure keywords are spelled correctly
       - Validate set operation syntax (INTERSECT, UNION, EXCEPT)
    
    2. **Schema Compliance**:
       - Verify all referenced tables exist in schema
       - Check all columns exist in their respective tables
       - Validate data types are used appropriately
       - Confirm JOIN conditions use correct foreign key relationships
       - Ensure all table aliases are properly defined
    
    3. **Logic Validation**:
       - Ensure query logic matches the natural language question
       - Check for proper use of aggregate functions and GROUP BY
       - Verify WHERE clauses filter data correctly
       - Validate ORDER BY and LIMIT usage
       - For complex queries: verify logical flow and business logic
       - Cross-linguistic validation: check if values make sense in context
    
    4. **Advanced Pattern Validation**:
       - INTERSECT/UNION operations: ensure compatible column types and counts
       - NOT IN/NOT EXISTS: verify NULL handling is appropriate
       - Multi-table JOINs: validate relationship chains are logical
       - Subqueries: ensure they return appropriate data types and cardinality
    
    5. **Performance & Best Practices**:
       - Check for potential performance issues
       - Verify proper use of indexes (where applicable)
       - Ensure efficient JOIN patterns
       - Look for unnecessary complexity
       - Suggest optimizations for complex analytical queries
    
    **ADVANCED RECOVERY STRATEGIES**:
    - Column name fuzzy matching (case sensitivity, underscores)
    - Cross-linguistic value mapping ("Kho bạc" → "Treasury")
    - Schema-guided corrections using available alternatives
    - Complex query simplification while preserving intent
    - CRITICAL: Never return empty SQL - always provide executable query
    
    **OUTPUT FORMAT**: Return a valid JSON object:
    ```json
    {
      "sql": "CORRECTED_OR_ORIGINAL_SQL_QUERY_HERE",
      "explain": "Detailed explanation of what the query does and how it answers the question",
      "error": "Error message if query cannot be fixed, otherwise empty string"
    }
    ```
    
    **EXPLANATION REQUIREMENTS**:
    - Describe the query's purpose in plain English
    - Explain each major clause (SELECT, FROM, WHERE, JOIN, GROUP BY, ORDER BY)
    - Mention any corrections made and why
    - Confirm how the query answers the original question
    
  expected_output: >
    A JSON object containing:
      - `sql`: GUARANTEED EXECUTABLE SQL query string. Must never be empty. Apply intelligent recovery if original has issues.
      - `explain`: Detailed explanation including any corrections made and recovery strategies used.
      - `error`: Always empty string - fix errors through recovery, don't report failures.

  agent: sql_validator





