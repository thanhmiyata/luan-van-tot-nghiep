question_analysis_task:
  description: >
    Analyze the following question:
    
    **Question:** {question}
    **Database:** ```{raw_db_schema}```
    
    Identify:
    1. **Intent:** COUNT, LIST, MAX_MIN, AGGREGATION
    2. **Complexity:** EASY (1 table), MEDIUM (2-3 tables), HARD (complex)
    3. **Required tables:** student, instructor, course, section, etc.
    4. **Required columns:** name, dept_name, semester, year, etc.
    5. **Filter values:** 'Math', 'Fall', 2009, etc.
    
    **Return JSON:**
    ```json
    {
      "intent": "COUNT|LIST|MAX_MIN|AGGREGATION",
      "complexity": "EASY|MEDIUM|HARD",
      "entities": {
        "tables": ["table1", "table2"],
        "columns": ["col1", "col2"],
        "values": ["val1", "val2"]
      },
      "confidence": 0.95
    }
    ```

  expected_output: >
    JSON object with question analysis including intent, complexity, entities and confidence score.
      
  agent: question_analyzer

select_needed_schema_task:
  description: >
    Filter database schema to keep only what's needed:
    
    **Question:** {question}
    **Original Schema:** ```{raw_db_schema}```
    **Analysis:** ```{question_analysis}```
    
    Based on question analysis:
    1. Keep tables mentioned in "entities.tables"
    2. Keep columns mentioned in "entities.columns" 
    3. Keep primary key and foreign key for JOIN
    4. Remove irrelevant tables/columns
    
    **Return JSON with same format as original schema:**
    ```json
    {
      "db_id": "database_name",
      "table_names_original": ["table1", "table2"],
      "column_names_original": [[0, "col1"], [1, "col2"]],
      "column_types": ["text", "number"]
    }
    ```

  expected_output: >
    JSON object containing filtered schema with same structure as original schema.
      
  agent: schema_selector

generate_sql_task:
  description: >
    Generate SQL query from the question:
    
    **Question:** "{question}"
    **Schema:** ```{db_schema}```
    **Analysis:** ```{question_analysis}```
    
    **IMPORTANT - Understanding logic:**
    1. **AND vs OR distinction:**
       - "courses in both fall AND spring" = courses in BOTH semesters → INTERSECT
       - "courses in fall OR spring" = courses in ANY semester → UNION
    
    2. **COUNT logic:**
       - Count departments → COUNT(DISTINCT dept_name)
       - Count courses → COUNT(DISTINCT course_id) (if duplicates exist)
       - Count students with advisors → COUNT(DISTINCT s_id)
    
    3. **GROUP BY logic:**
       - "courses offered by multiple departments" → GROUP BY title HAVING COUNT(*) > 1
       - "count by group" → GROUP BY column, COUNT(*)
    
    4. **Set operations:**
       - Both conditions → INTERSECT
       - Any condition → UNION
       - Exclude → EXCEPT
    
    5. **Key understanding for common mistakes:**
       - "enrollment" usually refers to STUDENT enrollment, not course sections
       - "highest enrollment department" = department with most STUDENTS
       - Use lowercase for column names when possible (id, not ID)
       - Prefer simple subqueries over complex JOINs when logically equivalent
    
    **CRITICAL - SQL Format Requirements:**
    - Return ONLY complete, executable SQL queries
    - SQL must be a single line without line breaks
    - Do NOT break SQL into multiple lines or fragments
    - Every SQL must start with SELECT, INSERT, UPDATE, or DELETE
    - Test your SQL mentally before returning
    
    **Return JSON:**
    ```json
    {
      "sql": "SELECT column FROM table WHERE condition"
    }
    ```

  expected_output: >
    JSON object containing the generated SQL query.

  agent: sql_expert

validate_sql_task:
  description: >
    Validate and fix SQL query:
    
    **SQL:** "{sql}"
    **Question:** "{question}"
    **Schema:** ```{db_schema}```
    
    Check:
    1. **Is syntax correct?** (SELECT, FROM, WHERE, etc.)
    2. **Do table/column names exist?**
    3. **Is logic correct?** (JOIN, WHERE conditions)
    4. **Can it be executed?**
    5. **Is SQL complete?** (Not a fragment or partial query)
    6. **Is SQL single-line?** (No line breaks or formatting issues)
    
    If errors exist, fix:
    - Fix incorrect table/column names (check schema carefully!)
    - **Convert ID to lowercase id for consistency**
    - **Fix prerequisite logic: course_id vs prereq_id confusion**
    - **Fix COUNT logic: use COUNT(DISTINCT) for unique entities, COUNT(*) for records**
    - **Remove unnecessary JOINs: if all columns in single table, use direct access**
    - **Fix column order: match expected output (avg, count not count, avg)**
    - **Fix GROUP BY: group by entity being counted, not display column**
    - Fix JOIN conditions
    - Simplify complex queries (prefer NOT IN over EXCEPT with JOIN)
    - **Fix enrollment logic: use student table directly, not complex JOINs**
    - Verify column consistency in set operations (EXCEPT/INTERSECT)
    - Combine SQL fragments into complete queries
    - Remove line breaks and format as single line
    
    **Return JSON:**
    ```json
    {
      "sql": "Fixed SQL query (or original if correct)",
      "explain": "Explanation of what this SQL does",
      "error": "Error message if cannot be fixed (empty if OK)"
    }
    ```

  expected_output: >
    JSON object containing validated/fixed SQL query, explanation and error message (if any).

  agent: sql_validator