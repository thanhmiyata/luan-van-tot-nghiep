question_analysis_task:
  description: >
    4-step: Analyzer. Extract intent, expected_output_fields (ordered), and single_table_ok flag.

    Inputs:
    - Question: {question}
    - Raw Schema (Spider JSON): ```{raw_db_schema}```

    Requirements:
    1) Map every expected field to real schema columns; never invent names.
    2) expected_output_fields preserves requested order; set field_order_critical=true.
    3) Mark single_table_ok=true when one table already has all needed columns.
    4) Provide structured filters/group_by/order_by/join_hints using real columns.
    5) Use provided `foreign_keys` and `primary_keys` to identify table relationships. Do not guess joins based on name similarity.

    Return JSON only (no markdown):
    {
      "intent": "COUNT|LIST|MAX_MIN|AGGREGATION|BOOLEAN|OTHER",
      "complexity": "EASY|MEDIUM|HARD",
      "expected_output_fields": ["field1", "field2"],
      "field_order_critical": true,
      "single_table_ok": true,
      "output_fields_detailed": [
        {"table": "t", "column": "c", "agg": "NONE|COUNT|COUNT_DISTINCT|SUM|AVG|MAX|MIN", "alias": null, "order_index": 0}
      ],
      "filters": [{"table": "t", "column": "c", "operator": "=|<>|>|<|>=|<=|LIKE|IN|BETWEEN", "value": "v", "value_type": "NUMBER|STRING|DATE|OTHER"}],
      "group_by": [{"table": "t", "column": "c"}],
      "order_by": [{"table": "t", "column": "c", "direction": "ASC|DESC"}],
      "join_hints": [{"from_table": "a", "to_table": "b", "reason": "why join"}],
      "entities": {"tables": ["t1"], "columns": ["c1"], "values": ["v1"]},
      "confidence": 0.95
    }
  expected_output: >
    JSON with expected_output_fields, field_order_critical and single_table_ok.
  agent: question_analyzer

select_needed_schema_task:
  description: >
    Filter schema for required tables/columns while preserving PK/FK needed for joins.

    Inputs:
    - Question: {question}
    - Original Schema: ```{raw_db_schema}```
    - Analysis: ```{question_analysis}```

    Steps:
    1) Start from tables in entities.tables and those referenced in outputs/filters/group_by/order_by.
    2) Keep columns used for outputs/filters/group_by/order_by and PK/FK of kept tables.
    3) Optionally keep intermediate tables to connect required tables.
    4) Prefer keeping a small safe superset over dropping a needed column.

    Return JSON with same structure as input schema.
  expected_output: >
    Filtered schema JSON preserving PK/FK connectivity.
  agent: schema_selector

generate_sql_task:
  description: >
    4-step: SQL Expert. Generate one-line SQL following expected_output_fields and single_table_ok.

    Inputs:
    - Question: "{question}"
    - Schema: ```{db_schema}```
    - Analysis: ```{question_analysis}```

    Core rules:
    1) SELECT exactly `expected_output_fields` in order; NEVER add ID columns or extra columns like `COUNT(*)` unless explicitly in the field list. If the question asks for "details", select the specific "Details" or "Name" column.
    2) If counting entities → COUNT(DISTINCT id/PK); GROUP BY all non-aggregates; avoid GROUP BY when only aggregate/single row.
    3) If single_table_ok=true, do not join; otherwise join only when needed for columns using ONLY the provided `foreign_keys` in the schema.
    4) Use `=` operator for specific values (e.g., Name = 'Alison'). Use `LIKE` ONLY if keywords like "contains" or "starts with" are used.
    5) Match values correctly: if 'game1' is a label, use the `Name` column, not `Filename`.
    6) ORDER BY only when question requires ranking/sorting.
    7) Correct set ops: AND/OR vs UNION/INTERSECT/EXCEPT as intended.
    8) No SELECT * unless explicitly asked; SQL must be a single executable line without comments.
  expected_output: >
    JSON {"sql": "<single-line SQL>"} honoring expected_output_fields and single_table_ok.
  agent: sql_expert

validate_sql_task:
  description: >
    4-step: Final Validator. Enforce final checklist and fix if needed.

    Inputs:
    - SQL: "{sql}"
    - Question: "{question}"
    - Schema: ```{db_schema}```
    - Analysis: ```{question_analysis}```

    Validate:
    - SELECT = expected_output_fields (content/order); COUNT uses DISTINCT when counting entities.
    - No unnecessary joins; correct PK/FK; remove ORDER BY unless asked.
    - Names exist in schema; SQL complete, one line, no comments.
    - Fix issues and return corrected SQL with short explain; if unfixable, include error.

    Return JSON {"sql": "...", "explain": "...", "error": ""}.
  expected_output: >
    Final validated SQL JSON.
  agent: sql_validator