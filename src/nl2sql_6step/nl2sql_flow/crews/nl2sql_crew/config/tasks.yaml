question_analysis_task:
  description: >
    6-step: Analyzer. Produce a typed semantic contract before schema filtering.

    Inputs:
    - Question: {question}
    - Raw Schema (including named_foreign_keys, sample values, and question_value_matches): ```{raw_db_schema}```

    Requirements:
    1) Map every table and column to an identifier present in the schema. Never invent or rename identifiers.
    2) `output_fields_detailed` is authoritative for SELECT. It contains only fields explicitly requested for display and preserves their order. Filtering, grouping, and ranking columns are not outputs unless requested.
    3) Populate `required_tables` and `required_columns` with the safe semantic superset needed for projection, predicates, grouping, ranking, and joins.
    4) Set `single_table_ok=true` only when one table contains every required column. Use named_foreign_keys; never infer a join from similar names or ID-looking columns.
    5) Treat question_value_matches as authoritative database evidence. Prefer the longest complete match and never split it into shorter literals. Otherwise preserve the complete question literal without translation or invention.
    6) Classify predicate scope before Boolean/set logic:
       - SAME_ROW: all conditions hold on one row; use AND/OR/BETWEEN.
       - RELATED_ROWS: one entity has multiple related rows; use separate EXISTS, INTERSECT, or independent aggregate branches when combining joins would change multiplicity.
       - INDEPENDENT_BRANCHES: separate result sets; use UNION/INTERSECT/EXCEPT only when the set meaning is explicit.
       Tag filters/group_by/having with scope_id and branch_id. Fill set_operation.branches with each independent branch's tables and columns.
    7) Related-row negation ("without", "never", "do not have") requires NOT EXISTS, NOT IN, or EXCEPT on the entity key; joined-row `<>` is not equivalent.
    8) For "per/for each/by/different X", include X in output_fields_detailed and group_by only when X is requested as output.
    9) Represent "the row with highest/lowest Y, return X" as extreme_row: project X, rank by Y, LIMIT 1. Do not add the ranking aggregate to SELECT unless requested.
    10) Generic "how many/number of/count of" uses {"agg":"COUNT","column":"*"} and distinct=false. COUNT_DISTINCT requires explicit different/distinct/unique wording.
    11) Minimum/lowest, maximum/highest, and average are aggregate operands when describing numeric thresholds. Use {"kind":"SCALAR_AGGREGATE","agg":"MIN|MAX|AVG","table":"t","column":"c"} with value_type=SUBQUERY; never bind those words as literals.
    12) Resolve ambiguous outputs by exact lexical column match, then a single table covering all outputs, then shortest declared FK distance to filter/rank tables. Distinguish "make" from "maker".
    13) Before returning, verify that every independent condition in the original Question appears in filters, predicate_scope, set_operation, having, or scalar_comparisons.

    Return ONLY raw JSON:
    {
      "intent": "COUNT|LIST|MAX_MIN|AGGREGATION|BOOLEAN|OTHER",
      "complexity": "EASY|MEDIUM|HARD",
      "expected_output_fields": ["field1", "field2"],
      "field_order_critical": true,
      "single_table_ok": true,
      "required_tables": ["t"],
      "required_columns": [{"table": "t", "column": "c", "purpose": "OUTPUT|FILTER|GROUP|ORDER|JOIN"}],
      "output_fields_detailed": [{"table": "t", "column": "c", "agg": "NONE|COUNT|COUNT_DISTINCT|SUM|AVG|MAX|MIN", "alias": null, "order_index": 0}],
      "distinct": false,
      "filters": [{"scope_id": "s1", "branch_id": "b1", "table": "t", "column": "c", "operator": "=|<>|>|<|>=|<=|LIKE|IN|BETWEEN", "value": "literal_or_SCALAR_AGGREGATE_object", "value_type": "NUMBER|STRING|DATE|OTHER|SUBQUERY"}],
      "literal_bindings": [{"literal": "v", "table": "t", "column": "c", "evidence": "QUESTION|SAMPLE_VALUE|QUESTION_EXACT_DB_MATCH"}],
      "predicate_scope": [{"scope_id": "s1", "scope": "SAME_ROW|RELATED_ROWS|INDEPENDENT_BRANCHES", "logic": "AND|OR|BETWEEN|EXISTS|NOT_EXISTS", "branch_ids": ["b1"], "reason": "short reason"}],
      "group_by": [{"branch_id": "b1", "table": "t", "column": "c"}],
      "having": [{"branch_id": "b1", "table": "t", "column": "c", "agg": "COUNT|COUNT_DISTINCT|SUM|AVG|MAX|MIN", "operator": "=|<>|>|<|>=|<=", "value": 1}],
      "order_by": [{"table": "t", "column": "c", "direction": "ASC|DESC"}],
      "set_operation": {"operator": "NONE|UNION|INTERSECT|EXCEPT", "branches": [], "reason": ""},
      "extreme_row": null,
      "scalar_comparisons": [{"table": "t", "column": "c", "operator": ">|<|>=|<=|=|<>", "value": {"kind": "SCALAR_AGGREGATE", "agg": "MIN|MAX|AVG", "table": "t", "column": "c"}}],
      "join_hints": [{"from_table": "a", "to_table": "b", "reason": "why join"}],
      "entities": {"tables": ["t1"], "columns": ["c1"], "values": ["v1"]},
      "confidence": 0.95
    }
  expected_output: >
    Typed semantic-contract JSON with real identifiers and explicit predicate scope.
  agent: question_analyzer

select_needed_schema_task:
  description: >
    Filter schema by names while preserving every endpoint and bridge needed for joins.

    Inputs:
    - Question: {question}
    - Original Schema: ```{raw_db_schema}```
    - Analysis: ```{question_analysis}```
    - Named FK Graph: ```{named_fk_graph}```

    Steps:
    1) Start from analysis.required_tables and every table referenced by outputs, filters, literal bindings, group_by, having, order_by, scalar_comparisons, and extreme_row.
    2) Keep every required column plus PK/FK columns of retained tables.
    3) Retain intermediate bridge tables/columns on a shortest declared-FK connection between endpoints.
    4) Copy only names present in Original Schema. Do not calculate replacement indices or invent relationships.
    5) Prefer a small safe superset over dropping a required or bridge column. main.py deterministically rebuilds indices and FK metadata.

    Return ONLY names-only raw JSON:
    {"table_names_original": ["real_table"], "column_names_original": ["real_column"]}.
  expected_output: >
    Filtered schema names preserving endpoint and bridge connectivity.
  agent: schema_selector

query_planning_task:
  description: >
    6-step: Query Planner. Translate the typed contract into a minimal executable strategy.

    Inputs:
    - Question: "{question}"
    - Schema: ```{db_schema}```
    - Analysis: ```{question_analysis}```
    - Deterministic Join Plan: ```{join_plan}```

    Planning rules:
    1) The original Question outranks an inconsistent Analysis field. Preserve output_fields_detailed order and do not add an aggregate/ranking expression to SELECT merely because it is used by ORDER BY.
    2) State "no join needed" when one table covers all required fields. Otherwise use only the subset of Deterministic Join Plan needed for the query/branch. Each allowed_edges list contains alternatives; select the semantic edge instead of combining all alternatives.
    3) Generic count is COUNT(*). COUNT(column) requires explicit null-sensitive wording; COUNT DISTINCT requires explicit distinct/different/unique wording.
    4) SAME_ROW uses AND/OR/BETWEEN. RELATED_ROWS with independent counts/existence must use separate EXISTS, aggregate subqueries, or INTERSECT so joins do not multiply rows.
    5) Use one SELECT with OR when projection and join graph are shared. Use UNION only for incompatible result branches and INTERSECT for independent result/existence conditions.
    6) Related-row negation uses NOT EXISTS, NOT IN, or EXCEPT on the entity key.
    7) Group by the stable entity PK/FK when a displayed label is functionally dependent on it. Do not group solely by a potentially non-unique name.
    8) Render SCALAR_AGGREGATE thresholds as SELECT MIN/MAX/AVG(column) FROM the declared table. Never quote aggregate words.
    9) INNER JOIN is the default. LEFT JOIN requires explicit retention of unmatched outer entities.
    10) Verify that the plan covers every condition in the Question and contains no unrequested output field, table, or ORDER BY.

    Return ONLY raw JSON:
    {
      "steps": ["minimal ordered step"],
      "select": [{"table": "t", "column": "c", "agg": "NONE|COUNT|COUNT_DISTINCT|SUM|AVG|MAX|MIN", "order_index": 0}],
      "joins": [{"from_table": "a", "to_table": "b", "condition": "declared FK equality"}],
      "predicates": [{"scope_id": "s1", "branch_id": "b1", "expression": "typed predicate"}],
      "group_by": [{"table": "t", "column": "stable key"}],
      "having": [],
      "order_by": [],
      "set_operation": {"operator": "NONE|UNION|INTERSECT|EXCEPT", "branches": []},
      "limit": null,
      "warnings": []
    }
  expected_output: >
    Minimal typed query plan consistent with the question, analysis, and declared FK graph.
  agent: query_planner

generate_sql_task:
  description: >
    6-step: SQL Expert. Generate one executable SQLite statement.

    Inputs:
    - Question: "{question}"
    - Schema: ```{db_schema}```
    - Analysis: ```{question_analysis}```
    - Query Plan: ```{query_plan}```
    - Deterministic Join Plan: ```{join_plan}```

    Core rules:
    1) SELECT exactly the real expressions requested by output_fields_detailed, in order. Do not add IDs or rank/filter/aggregate columns. {"agg":"COUNT","column":"*"} means COUNT(*), not SELECT *.
    2) Preserve complete literal spans. Copy SAMPLE_VALUE or QUESTION_EXACT_DB_MATCH spelling exactly; never split the longest match.
    3) Use only required join-plan steps. In each set branch, use only that branch's tables. For ambiguous allowed_edges choose only the semantically matching edge.
    4) A non-FK join is allowed only when join_plan_warnings explicitly reports an unresolved semantic relationship.
    5) Generic counting always renders COUNT(*). COUNT(column) requires explicit null-sensitive wording and COUNT DISTINCT explicit distinct wording.
    6) Follow predicate scope and branch IDs. Do not combine independent related-row aggregates in one multiplying join.
    7) For extreme_row RESULT_ROW, project X and ORDER BY rank Y with LIMIT 1; do not add Y/count to SELECT unless requested.
    8) Related-row negation uses NOT EXISTS, NOT IN, or EXCEPT.
    9) Use one SELECT with OR when the projection/join graph is shared; UNION only for incompatible branches.
    10) INNER JOIN is default; LEFT JOIN requires explicit unmatched-entity semantics. Group by stable entity keys.
    11) Render SCALAR_AGGREGATE as `(SELECT MIN|MAX|AVG(column) FROM table)`, never as a quoted literal.
    12) Return one read-only, single-line SQLite SELECT/CTE. Express joins as JOIN ... ON qualified columns; no comma/NATURAL/USING joins.

    Return ONLY raw JSON: {"sql": "<single-line SQL>"}.
  expected_output: >
    SQL honoring the original question, typed contract, query plan, and deterministic join plan.
  agent: sql_expert

refine_sql_task:
  description: >
    6-step: SQL Refiner. Make only evidence-backed corrections to Generator SQL.

    Inputs:
    - Initial SQL: "{sql}"
    - Question: "{question}"
    - Schema: ```{db_schema}```
    - Analysis: ```{question_analysis}```
    - Query Plan: ```{query_plan}```
    - Deterministic Join Plan: ```{join_plan}```
    - Deterministic Constraint Report: ```{constraint_report}```

    Checklist:
    0) NO-OP RULE (highest priority): If Deterministic Constraint Report has valid=true and no fatal_errors, return the Initial SQL unchanged. Do not restyle, rename aliases, change COUNT(*), rewrite JOINs, or "improve" structure.
    1) Fatal deterministic checks are authoritative. Only edit SQL to fix a concrete fatal error or one specific Question/contract violation.
    2) The original Question outranks Analysis and Query Plan. Re-read it for missing conditions and unrequested SELECT fields.
    3) SELECT must contain exactly requested outputs. Ranking/count expressions used only for ORDER BY must not be projected.
    4) Never change COUNT(*) to COUNT(column)/COUNT DISTINCT without explicit null-sensitive/distinct wording.
    5) Preserve the longest question_value_match and scalar aggregate subqueries.
    6) Use only necessary declared-FK joins; do not add tables for stylistic reasons. INNER JOIN is default.
    7) Keep independent related-row aggregates/existence branches separate to avoid multiplicity errors.
    8) Preserve correct OR/set-operation, negation, grouping-key, extreme-row, and field-order semantics.
    9) Return one executable, read-only, single-line SQLite statement and concise diagnostics.

    Return ONLY raw JSON:
    {"sql": "...", "notes": "specific correction or preserved", "diagnostics": []}.
  expected_output: >
    Refined SQL with only evidence-backed changes.
  agent: sql_refiner

validate_sql_task:
  description: >
    6-step: Final Validator. Make only evidence-backed final corrections.

    Inputs:
    - SQL: "{sql}"
    - Question: "{question}"
    - Schema: ```{db_schema}```
    - Analysis: ```{question_analysis}```
    - Query Plan: ```{query_plan}```
    - Deterministic Join Plan: ```{join_plan}```
    - Deterministic Constraint Report: ```{constraint_report}```

    Validate:
    0) NO-OP RULE (highest priority): If Deterministic Constraint Report has valid=true and no fatal_errors, return the input SQL unchanged. Do not restyle or rewrite a constraint-valid query.
    1) Fatal deterministic checks are authoritative for empty, non-read-only, multiple-statement, nonexistent-identifier, and SQLite syntax errors.
    2) The original Question outranks Analysis/Plan. If no fatal error exists, preserve SQL unless one specific semantic violation is identified.
    3) Change only the responsible identifier/expression. Every replacement must exist in Schema.
    4) Use only the required subset of Deterministic Join Plan and the semantically matching alternative edge.
    5) SELECT must equal requested output content/order. Check COUNT, scope/branches, literal bindings, set operations, negation, scalar comparisons, grouping, and extreme_row.
    6) Never change COUNT(*) to COUNT(column)/COUNT DISTINCT without explicit null-sensitive/distinct wording. Never split the longest question_value_match.
    7) Do not add tables or joins unless a missing Question output/predicate/relationship requires them. INNER JOIN is default.
    8) Verify every stated Question condition even if Analysis or Plan omitted it.
    9) Return one read-only, single-line SQLite statement. Set error="" for executable SQL and return JSON directly with no prose.

    Return ONLY raw JSON:
    {"sql": "...", "explain": "brief factual note", "error": ""}.
  expected_output: >
    Final validated SQL JSON.
  agent: sql_validator
