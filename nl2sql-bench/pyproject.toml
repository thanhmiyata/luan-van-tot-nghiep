[project]
name = "nl2sql-bench"
version = "0.1.0"
description = "A standardized evaluation framework for NL2SQL systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "NL2SQL Research Team"}
]
keywords = ["nl2sql", "text-to-sql", "benchmark", "evaluation", "spider"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "black", "ruff"]
baselines = ["crewai", "openai", "anthropic", "google-generativeai"]

[project.scripts]
nl2sql-bench = "nl2sql_bench.cli:main"

[project.urls]
Homepage = "https://github.com/nl2sql-research/nl2sql-bench"
Repository = "https://github.com/nl2sql-research/nl2sql-bench"
Documentation = "https://github.com/nl2sql-research/nl2sql-bench#readme"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nl2sql_bench*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
