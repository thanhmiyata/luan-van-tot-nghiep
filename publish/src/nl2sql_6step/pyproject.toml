[project]
name = "nl2sql_flow"
version = "0.1.0"
description = "experiment3_multi_agent_crewai using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.148.0,<1.0.0",
    "sqlglot>=27.0.0,<29.0.0",
]

[project.scripts]
kickoff = "nl2sql_flow.main:kickoff"
run_crew = "nl2sql_flow.main:kickoff"
plot = "nl2sql_flow.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
